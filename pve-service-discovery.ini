[discovery]
# How long each local HTTP/HTTPS probe may wait.
timeout = 1.0

# Concurrent probes. Discovery traffic stays on the networks reachable by this node.
workers = 16

# Bound the work done by one unusual container.
max_ips = 4
max_ports = 64
max_body_bytes = 65536
max_description_bytes = 65536

# If / is a 404 or generic server page, try a few paths derived from the CT name.
# Example: apache-guacamole automatically tries /guacamole/.
path_probe_limit = 6

# Replace stale links with a clear stopped message.
mark_stopped = true

# Templates are skipped by default.
include_templates = false

# Common non-web services that should never receive an HTTP probe.
ignored_ports = 21,22,25,53,67,68,69,110,111,123,137,138,139,143,389,445,465,514,587,631,636,873,989,990,993,995,1080,1194,1812,1813,2049,2375,2376,3306,3389,5432,5900,5901,5902,6379,6443,8006,9100,27017

# Try HTTPS before HTTP on these ports.
secure_ports = 443,4430,4443,7443,8443,9443,10443

# Optional per-container overrides. Remove the leading semicolons to enable.
#
#[container:105]
#enabled = true
#addresses = 192.168.1.87
#include_ports = 8090
#ignore_ports = 1234
#label.8090 = Beszel
#path.8090 = /
#scheme.8090 = http
